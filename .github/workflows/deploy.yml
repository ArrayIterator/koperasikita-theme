name: Deploy theme to live site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ACTIONS
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ secrets.OPS_DIR || vars.OPS_DIR }}"
            git pull origin main
            # dist/ is gitignored, so rebuild the assets on the server.
            if command -v bun >/dev/null 2>&1; then
              bun install
              bun run build
            else
              npm install
              npm run build
            fi
            # Verify the build produced the Vite manifest.
            test -f dist/.vite/manifest.json
            # Post-deploy health check: the site must still serve.
            # Retry ~30s; fail the deploy if the homepage never returns 200.
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" https://koperasikita.pentagonal.org/ 2>/dev/null || true)
              if [ "$code" = "200" ]; then
                echo "Health check OK: homepage=$code"
                break
              fi
              echo "Waiting for site... attempt $i/15 (homepage=$code)"
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "Health check FAILED after ~30s (homepage=$code)"
              exit 1
            fi
